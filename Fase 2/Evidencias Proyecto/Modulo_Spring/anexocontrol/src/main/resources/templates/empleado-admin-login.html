<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnexoControl | Acceso</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
    <link rel="stylesheet" th:href="@{/css/layout.css}" href="/css/layout.css">
    <link rel="stylesheet" th:href="@{/css/auth-pages.css}" href="/css/auth-pages.css">
</head>
<body class="auth-page">
<section class="auth-card">
    <h1 class="auth-title">Acceso Autorizado</h1>
    <p class="auth-subtitle">Sistema de Tarificación Telefónica</p>

        <!-- Mensaje de error de login (parámetro ?error=true en la URL) -->
    <div th:if="${param.error}"
         style="background: rgba(255,123,134,0.10); border: 1px solid rgba(255,123,134,0.35);
                padding: 12px 16px; color: var(--red); font-size: 14px; line-height: 1.5;">
        Usuario o contraseña incorrectos.
    </div>
    <!-- Mensaje de éxito (ej: registro completado) -->
    <div th:if="${msg}"
         style="background: rgba(0,219,233,0.08); border: 1px solid rgba(0,219,233,0.3);
                padding: 12px 16px; color: var(--cyan); font-size: 14px; line-height: 1.5;"
         th:text="${msg}">
    </div>

    <form class="auth-form" th:action="@{/web/login}" action="/web/login" method="post">
        <div class="form-group">
            <label class="form-label" for="nombreUsuario">Usuario</label>
            <input class="form-input" id="nombreUsuario" name="nombreUsuario" type="text" placeholder="ID de operador" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="contrasenha">Contraseña</label>
            <input class="form-input" id="contrasenha" name="contrasenha" type="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary" type="submit">Iniciar Sesión</button>
        <div class="auth-actions" style="justify-content:center; border-top:0; padding-top:4px;">
            <a class="btn btn-secondary" th:href="@{/registrar-usuario}" href="/registrar-usuario">Crear Cuenta</a>
        </div>
    </form>
</section>
</body>
</html>
